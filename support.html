<h2>常見問題</h2>
<p><strong>買了完整內容但顯示鎖住？</strong><br>請到 設定 → 關於 → 「恢復購買」，並確認手機登入的是購買時的 Apple ID。</p>
<p><strong>Part 2 為什麼看不到選項文字？</strong><br>正式測驗的 Part 2 不印選項，請聽完後直接選 A／B／C；答完會顯示原文與解析。</p>
<p><strong>模擬分數怎麼算？</strong><br>該回全部作答完後，依答對率以常見聽力換算表估算（5–495），非官方成績。</p>
<p><strong>音檔是真人錄音嗎？</strong><br>不是，所有語音由 AI 語音合成模型生成（美式、英式、澳式口音）。</p>
